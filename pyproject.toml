[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jepa-lmc"
version = "0.1.0"
description = "Action-conditioned JEPA transition models for formal verification research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "PyYAML>=6.0",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "experiments", "tests"]
extraPaths = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
